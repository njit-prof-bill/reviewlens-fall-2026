services:
  db:
    image: postgres:16
    container_name: ${APP_SLUG:-reviewlens}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reviewlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reviewlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_db_data:
    name: ${APP_SLUG:-reviewlens}_db_data