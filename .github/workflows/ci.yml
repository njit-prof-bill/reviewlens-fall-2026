name: ci

'on':
  pull_request:
  push:
    branches:
      - "**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  infra-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.infra == 'true' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        working-directory: infra/providers/aws/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init (backend disabled)
        working-directory: infra/providers/aws/terraform/environments/dev
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infra/providers/aws/terraform/environments/dev
        run: terraform validate

  web-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Test web
        working-directory: apps/web
        run: npm run test:coverage
      - name: Setup Python for changed-line coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install changed-line coverage tool
        if: ${{ github.event_name == 'pull_request' }}
        run: pip install 'diff-cover>=9.0.0,<10.0.0'
      - name: Enforce 80% changed-line coverage for web
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: apps/web
        run: >-
          diff-cover coverage/cobertura-coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80
      - name: Build web
        working-directory: apps/web
        run: npm run build

  api-checks:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install api dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint api
        working-directory: apps/api
        run: ruff check app tests
      - name: Check api formatting
        working-directory: apps/api
        run: ruff format --check app tests
      - name: Test api
        working-directory: apps/api
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Enforce 80% changed-line coverage for api
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: apps/api
        run: >-
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=80

  security-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit web dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit api dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e . 'pip-audit>=2.7.0,<3.0.0'
          pip freeze --exclude-editable > /tmp/reviewlens-api-requirements.txt
          pip-audit --strict -r /tmp/reviewlens-api-requirements.txt

  release-gate:
    runs-on: ubuntu-latest
    needs: [infra-checks, web-checks, api-checks, security-checks]
    if: ${{ always() }}
    steps:
      - name: Require all applicable quality checks
        env:
          INFRA_RESULT: ${{ needs.infra-checks.result }}
          WEB_RESULT: ${{ needs.web-checks.result }}
          API_RESULT: ${{ needs.api-checks.result }}
          SECURITY_RESULT: ${{ needs.security-checks.result }}
        run: |
          for result in "$INFRA_RESULT" "$WEB_RESULT" "$API_RESULT" "$SECURITY_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required quality check failed or was cancelled: $result" >&2
              exit 1
            fi
          done